{% extends "base.html" %}
{% load static %}

{% block title %}{{ title }}{% endblock %}

{% block content %}
<style>
    * {
        box-sizing: border-box;
    }
    
    .module-form-wrapper {
        max-width: 800px;
        margin: 0 auto;
        padding: 40px 20px;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        min-height: 100vh;
    }
    
    .form-container {
        background: white;
        border-radius: 20px;
        padding: 50px;
        box-shadow: 0 10px 40px rgba(0,0,0,0.1);
        width: 100%;
    }
    
    .back-link {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        color: #667eea;
        text-decoration: none;
        font-weight: 600;
        margin-bottom: 20px;
        transition: color 0.3s ease;
    }
    
    .back-link:hover {
        color: #764ba2;
    }
    
    .form-header {
        margin-bottom: 30px;
        width: 100%;
    }
    
    .form-header h1 {
        font-size: 28px;
        color: #2d3748;
        margin: 0 0 10px 0;
        background: none;
        padding: 0;
    }
    
    .course-name {
        color: #667eea;
        font-weight: 600;
    }
    
    .form-group {
        margin-bottom: 25px;
        width: 100%;
        display: block;
    }
    
    .form-group label {
        display: block;
        color: #2d3748;
        font-weight: 600;
        margin-bottom: 10px;
        font-size: 15px;
        width: 100%;
    }
    
    .form-group input,
    .form-group textarea {
        width: 100%;
        padding: 14px 18px;
        border: 2px solid #e2e8f0;
        border-radius: 12px;
        font-size: 15px;
        transition: all 0.3s ease;
        background: #f7fafc;
        font-family: inherit;
    }
    
    .form-group input:focus,
    .form-group textarea:focus {
        outline: none;
        border-color: #667eea;
        background: white;
        box-shadow: 0 0 0 4px rgba(102, 126, 234, 0.1);
    }
    
    .form-group textarea {
        resize: vertical;
        min-height: 100px;
    }
    
    .form-actions {
        display: flex;
        gap: 15px;
        margin-top: 30px;
        padding-top: 25px;
        border-top: 2px solid #e2e8f0;
        width: 100%;
        clear: both;
    }
    
    .btn {
        padding: 14px 28px;
        border-radius: 10px;
        text-decoration: none;
        font-weight: 600;
        transition: all 0.3s ease;
        border: none;
        cursor: pointer;
        font-size: 15px;
        display: inline-block;
        text-align: center;
    }
    
    .btn-primary {
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: white;
        box-shadow: 0 4px 15px rgba(102, 126, 234, 0.3);
        flex: 1;
    }
    
    .btn-primary:hover {
        transform: translateY(-2px);
        box-shadow: 0 6px 20px rgba(102, 126, 234, 0.4);
    }
    
    .btn-secondary {
        background: white;
        color: #667eea;
        border: 2px solid #667eea;
    }
    
    .btn-secondary:hover {
        background: #f7fafc;
    }
</style>

<div class="module-form-wrapper">
    <div class="form-container">
        <a href="{% url 'course_detail' course.id %}" class="back-link">
            ← Back to Course
        </a>
        
        <div class="form-header">
            <h1>{{ title }}</h1>
            <p>Course: <span class="course-name">{{ course.title }}</span></p>
        </div>

        <form method="post">
            {% csrf_token %}
            
            <div class="form-group">
                <label for="{{ form.title.id_for_label }}">Module Title *</label>
                {{ form.title }}
            </div>

            <div class="form-group">
                <label for="{{ form.description.id_for_label }}">Description</label>
                {{ form.description }}
            </div>

            <div class="form-actions">
                <button type="submit" class="btn btn-primary">
                    ✨ Add Module
                </button>
                <a href="{% url 'course_detail' course.id %}" class="btn btn-secondary">Cancel</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
